version: '3.8'

services:
  # Serviço PHP-FPM
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-php
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    ports:
    - "5173:5173" # Vite
    networks:
      - laravel-network

  # Servidor Web Nginx
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "8080:80"   # Acesse via http://localhost:8080
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel-network

  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    ports:
      - "3306:3306"  # Expondo a porta padrão para acessar via host, se quiser
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel-network

  # phpMyAdmin - Interface web para gerenciar o MySQL
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel-phpmyadmin
    ports:
      - "8081:80"   # Acesse via http://localhost:8081
    environment:
      PMA_HOST: mysql          # Nome do serviço MySQL no docker-compose
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - laravel-network

# Volumes persistentes
volumes:
  mysql_data:

# Redes internas
networks:
  laravel-network:
    driver: bridge